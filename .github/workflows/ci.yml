name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static skill validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate skill files
        run: bash scripts/check.sh

  api-key-gate:
    name: API key present?
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.gate.outputs.has_key }}
    steps:
      - id: gate
        env:
          HAS_KEY: ${{ secrets.Z_AI_KEY != '' || secrets.ANTHROPIC_API_KEY != '' }}
        run: echo "has_key=$HAS_KEY" >> "$GITHUB_OUTPUT"

  vmodel-loop:
    name: V-model loop smoke test
    needs: api-key-gate
    if: needs.api-key-gate.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.300
      - name: Install skill
        run: |
          mkdir -p ~/.claude/skills
          cp -r skills/vibe-model ~/.claude/skills/vibe-model
      - name: Run v-model loop on a seeded project
        working-directory: ${{ runner.temp }}
        env:
          # Z.AI endpoint (existing secret), like the pre-migration CI
          ANTHROPIC_BASE_URL: "https://api.z.ai/api/anthropic"
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.Z_AI_KEY }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "glm-4.7"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "glm-5.3-flash"
          ANTHROPIC_DEFAULT_OPUS_MODEL: "glm-5.3-flash"
          # Trim non-essential model calls / telemetry; tolerate non-Anthropic model ids
          DISABLE_NON_ESSENTIAL_MODEL_CALLS: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          CLAUDE_CODE_DISABLE_UNKNOWN_MODEL_WINDOW_ENFORCEMENT: "1"
        run: |
          git init smoke-project && cd smoke-project
          git config user.email smoke@test.local && git config user.name smoke
          echo "# Smoke project" > README.md && git add . && git commit -m init
          claude --print --dangerously-skip-permissions \
            "/vibe-model Add a hello() function in hello.py that prints hello, and document it in README.md (single milestone). AUTONOMOUS CI SMOKE RUN: this session has no human. Do not ask any questions; take your own recommended option for every decision branch, skip grilling, and skip optional housekeeping proposals. Drive the full V-loop start to finish and finish with the milestone wrap-up commit."
      - name: Assert milestone landed
        working-directory: ${{ runner.temp }}/smoke-project
        run: |
          # A single-milestone run's durable evidence: a wrap-up commit and the change itself.
          commits=$(git rev-list --count HEAD)
          if [ "$commits" -lt 2 ]; then
            echo "::error::vibe-model made no wrap-up commit beyond the seed init ($commits commit(s))"
            exit 1
          fi
          grep -qi hello README.md || {
            echo "::error::hello function was not documented in README.md"
            exit 1
          }
          test -f hello.py || {
            echo "::error::hello.py was not created"
            exit 1
          }
          if ls docs/plan-for-*.md docs/vibe-model/ >/dev/null 2>&1; then
            echo "vibe-model also produced epic working files"
          else
            echo "note: single-milestone run produced no outer-loop files (expected for one spin of the inner V-loop)"
          fi
